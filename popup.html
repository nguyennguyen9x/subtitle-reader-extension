<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 210px;
            font-family: Arial, sans-serif;
            padding: 12px;
            margin: 0;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        label {
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 6px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover {
            background-color: #c9302c;
        }
    </style>
</head>

<body>
    <div class="row">
        <label for="enable-toggle"><strong>Bật Sherpa TTS</strong></label>
        <input type="checkbox" id="enable-toggle" checked>
    </div>
    <button id="reset-btn">🔄 Reset mảng & Hàng đợi</button>
    <script src="popup.js"></script>
</body>

</html>
